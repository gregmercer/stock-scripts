name: Weekly Stock Report

on:
  schedule:
    # Runs every Friday at 10pm UTC (2pm PST / 3pm PDT)
    - cron: '0 22 * * 5'
  workflow_dispatch: # This allows you to run it manually for testing

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: |
          uv sync

      # Anchor to the most recent Friday rather than today, so a manual run on
      # any other day still lands on the weekly cadence instead of leaving an
      # off-cadence report behind. On the Friday schedule this is today.
      - name: Resolve report date
        run: |
          DOW=$(TZ=America/Los_Angeles date +%u)          # 1=Mon .. 7=Sun
          OFFSET=$(( (DOW - 5 + 7) % 7 ))                 # days back to Friday
          REPORT_DATE=$(TZ=America/Los_Angeles date -d "-${OFFSET} days" +%Y-%m-%d)
          echo "REPORT_DATE=${REPORT_DATE}" >> $GITHUB_ENV
          echo "BACKTEST_YEAR=${REPORT_DATE%%-*}" >> $GITHUB_ENV
          echo "Reporting for week ending ${REPORT_DATE}"

      - name: Run weekly performance report
        run: |
          uv run weekly-performance.py > output/weekly-performance-report-${REPORT_DATE}.txt

      - name: Run complete analysis pipeline
        run: |
          uv run run-analysis.py

      # Refreshes backtests/<current year>/ so the year-to-date result keeps up
      # with the weekly reports. Allowed to fail: it is a second network fetch,
      # and a bad day at Yahoo should not hold back the weekly reports.
      - name: Update current-year backtest
        continue-on-error: true
        run: |
          uv run backtest.py --year ${BACKTEST_YEAR}

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git pull

          # Show what files were generated
          echo "Files generated in output/:"
          ls -lh output/

          # Add all output files, plus the refreshed current-year backtest
          git add output/*.txt output/*.json
          git add backtests/ || true

          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Weekly report ${REPORT_DATE}" \
                       -m "Generated files:" \
                       -m "- weekly-performance-report-${REPORT_DATE}.txt" \
                       -m "- weekly-performance-${REPORT_DATE}.json" \
                       -m "- rolling-performance-${REPORT_DATE}.json" \
                       -m "- report-rolling-performance-${REPORT_DATE}.txt" \
                       -m "- report-running-portfolio-${REPORT_DATE}.txt" \
                       -m "- report-dollar-return-${REPORT_DATE}.txt" \
                       -m "- backtests/${BACKTEST_YEAR}/ (year to date)"
            git push
            echo "Changes pushed successfully"
          fi
